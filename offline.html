<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#234c43">
    <title>You're offline — SpendWise</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f2e9; color: #294a40; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 36px 28px; border: 1px solid #e4e1d7; border-radius: 24px; background: #fffdf8; text-align: center; box-shadow: 0 18px 60px #294a4012; }
      img { width: 72px; height: 72px; margin: 0 auto 20px; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -.04em; }
      p { margin: 12px 0 0; color: #73827c; }
      button { margin-top: 24px; padding: 12px 20px; border: 0; border-radius: 12px; background: #234c43; color: #fffdf8; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/pwa-icon.svg" alt="">
      <h1>You're offline</h1>
      <p>Connect to the internet to sign in and view your SpendWise account.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
