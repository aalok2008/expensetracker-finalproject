    <style>
      #connection-status[hidden] { display: none; }
      #connection-status {
        position: fixed;
        z-index: 1000;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(16px, env(safe-area-inset-bottom));
        left: max(16px, env(safe-area-inset-left));
        width: fit-content;
        max-width: calc(100% - 32px);
        margin-inline: auto;
        padding: 12px 16px;
        border: 1px solid #e6cb92;
        border-radius: 14px;
        background: #234c43;
        color: #fffdf8;
        font: 600 13px/1.5 system-ui, sans-serif;
        box-shadow: 0 8px 28px #152b2540;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="connection-status" role="status" aria-live="polite" hidden>
      You’re offline. Showing saved data where available; changes need an internet connection.
    </div>
    <script>
      const connectionStatus = document.getElementById("connection-status");
      const updateConnectionStatus = () => {
        connectionStatus.hidden = navigator.onLine;
      };
      window.addEventListener("online", updateConnectionStatus);
      window.addEventListener("offline", updateConnectionStatus);
      updateConnectionStatus();
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js").catch((error) => {
            console.error("SpendWise couldn't register its offline app shell.", error);
          });
        });
      }
    </script>
</body></html>
